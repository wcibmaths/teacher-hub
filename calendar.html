<!DOCTYPE html>
<html lang="en">
<head>
<script src="./wcib-gate.js" data-subtitle="School Calendar"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>WCIB Maths — School Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./hub.css?v=2026-10-25">
</head>
<body>
<!-- ── SIDEBAR ── -->
<aside class="sidebar">
  <div class="sb-top">
    <div class="sb-brand">
      <div class="sb-logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="11"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="16" x2="15" y2="16"/><line x1="9" y1="19" x2="15" y2="19"/><line x1="3" y1="12" x2="21" y2="12" opacity="0"/></svg></div>
      <div>
        <div class="sb-name">WCIB Maths</div>
      </div>
    </div>
    <div class="sb-sub">Department Hub</div>
  </div>

  <!-- Today, term, week, cycle -->
  <div class="sb-now">
    <div class="sb-now-day" id="now-dow">&nbsp;</div>
    <div class="sb-now-date" id="now-date">&nbsp;</div>
    <div class="sb-now-month" id="now-month">&nbsp;</div>
    <div class="sb-now-rows">
      <div class="sb-now-row"><span class="sb-now-k">Term</span><span class="sb-now-v" id="now-term">&mdash;</span></div>
      <div class="sb-now-row"><span class="sb-now-k">Week</span><span class="sb-now-v" id="now-week">&mdash;</span></div>
      <div class="sb-now-row"><span class="sb-now-k">Cycle</span><span class="sb-now-v"><span class="sb-now-cycle" id="now-cycle">&mdash;</span></span></div>
    </div>
    <div class="sb-now-next" id="now-next"><b>Next up</b>&mdash;</div>
  </div>

  <div class="sb-pages">
    <a class="sb-page" href="./index.html" title="Department Home">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="sb-page-lbl">Department Home</span>
    </a>
    <a class="sb-page active" href="./calendar.html" title="School Calendar">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="sb-page-lbl">School Calendar</span>
    </a>
  </div>

  <div class="sb-bottom">
    <div class="sb-date" id="sb-date">&mdash;</div>
  </div>
</aside>

<!-- ── WRAPPER ── -->
<div class="wrapper">

  <!-- TOPBAR -->
  <div class="topbar">
    <div>
      <div class="tb-greeting">School Calendar</div>
      <div class="tb-sub" id="tb-date"></div>
    </div>
    <div class="tb-right">
      <a href="https://wcibmaths.github.io/sow/" target="_blank" rel="noopener noreferrer" title="Scheme of Work 2026/27">
        <button class="tb-btn tb-btn-primary">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          <span class="tb-lbl">Scheme of Work</span>
        </button>
      </a>
      <span class="tb-sep"></span>
      <a href="https://wcibmaths.github.io/student-hub/" target="_blank" rel="noopener noreferrer" title="Student Maths Hub">
        <button class="tb-btn tb-btn-ghost">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span class="tb-lbl">Student Hub</span>
        </button>
      </a>
      <a href="https://trello.com/b/Gg4twjge/math-dept-tracker" target="_blank" rel="noopener noreferrer" title="Maths Dept Tracker">
        <button class="tb-btn tb-btn-ghost">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="3" height="9" rx="1"/><rect x="14" y="7" width="3" height="5" rx="1"/></svg>
          <span class="tb-lbl">Trello</span>
        </button>
      </a>
    </div>
  </div>

  <!-- BODY -->
  <div class="body body-wide">
    <div class="main">
      <div class="cal-wrap sow-port">
        <div class="cal-page-head">
          <h2>WCIB Academic Calendar 2026/27</h2>
          <span>Key dates &middot; the same file the Scheme of Work reads</span>
        </div>
        <div id="calendar-content"></div>
      </div>
    </div><!-- /main -->
  </div><!-- /body -->
</div><!-- /wrapper -->

<!-- The Pearson timetable is the Scheme of Work's file: one source for both sites. -->
<script src="https://wcibmaths.github.io/sow/exam-dates.js?v=pearson-final-2026-11-r2"></script>
<script src="./school-calendar.js?v=2026-10-25"></script>
<script src="./hub-dash.js?v=2026-10-25"></script>
<script>
WCIB_HUB.start('calendar');
</script>
</body>
</html>
